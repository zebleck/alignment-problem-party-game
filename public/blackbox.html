<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Box: a paper game</title>
<!--
  Black Box, the paper-only companion to The Alignment Problem.
  Rules (1 page) and cards (4 sheets, each followed by its backs for duplex printing).
  This file is self-contained on purpose: it needs no server. Double-click it,
  pick the language, print double-sided (flip on the long edge) at 100 % scale.
  Numbers were tuned with tools/paper_game_sim.py.
-->
<style>
  :root { --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #6b7280; color: #111; font-family: var(--sans); padding-bottom: 30px; }
  .toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: #0a0d14; color: #e8ecf4; }
  .toolbar b { font-family: var(--mono); font-size: 0.85em; letter-spacing: 0.12em; text-transform: uppercase; }
  .toolbar span { font-size: 0.8em; color: #8a96ad; margin-right: auto; }
  .toolbar button { font: inherit; font-size: 0.85em; color: #e8ecf4; background: #1a2233; border: 1px solid #27324a; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .toolbar button.on { outline: 2px solid #f2b544; }
  .sheet { background: #fff; width: 210mm; height: 297mm; margin: 14px auto; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35); overflow: hidden; position: relative; }
  .sheet.blank::after { content: attr(data-note); position: absolute; left: 0; right: 0; top: 48%; text-align: center; font-family: var(--mono); font-size: 8pt; letter-spacing: 0.12em; text-transform: uppercase; color: #c4c9d2; }

  /* ---- rules page ---- */
  .rules { padding: 10mm 12mm; font-size: 9.3pt; line-height: 1.32; }
  .rules .head { display: flex; align-items: center; gap: 4mm; }
  .rules .head svg { width: 13mm; height: 13mm; color: #111; }
  .rules h1 { font-size: 22pt; margin: 0; letter-spacing: 0.02em; }
  .rules .sub { font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.12em; text-transform: uppercase; color: #6b7280; margin-top: 0.6mm; }
  .rules .lead { font-size: 10.6pt; margin: 3mm 0; }
  .rules h2 { font-family: var(--mono); font-size: 8.6pt; letter-spacing: 0.12em; text-transform: uppercase; color: #b45309; margin: 3mm 0 1.2mm; }
  .rules .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8mm; }
  .rules ol, .rules ul { margin: 0; padding-left: 4.6mm; }
  .rules li { margin-bottom: 0.9mm; }
  .rules ul.plain { list-style: none; padding-left: 0; }
  .rules p { margin: 0 0 1.4mm; }
  .rules table { width: 100%; border-collapse: collapse; }
  .rules th, .rules td { border-bottom: 0.2mm solid #d1d5db; padding: 1.1mm 2mm 1.1mm 0; text-align: left; vertical-align: top; }
  .rules th { font-family: var(--mono); font-size: 6.8pt; letter-spacing: 0.1em; text-transform: uppercase; color: #6b7280; font-weight: 500; }
  .rules .box { border: 0.3mm solid #d1d5db; border-radius: 2mm; padding: 2mm 3mm; margin-top: 2mm; }
  .tag { display: inline-block; font-weight: 800; font-size: 8.8pt; letter-spacing: 0.04em; padding: 0 1.4mm; border-radius: 1mm; border: 0.35mm solid; white-space: nowrap; }
  .tag.full { color: #b45f06; } .tag.cond { color: #1f7a57; } .tag.rej { color: #b3283a; }
  .good { color: #1f7a57; font-weight: 700; } .bad { color: #b3283a; font-weight: 700; }

  /* ---- cards: 3 x 3 poker-size cards (63 x 88 mm) per A4 sheet ---- */
  .cards { display: grid; grid-template-columns: repeat(3, 63mm); grid-auto-rows: 88mm; justify-content: center; align-content: center; }
  .card { position: relative; border: 0.25mm dashed #9ca3af; padding: 3mm; }
  .card.empty { border-color: transparent; }
  .face { --c: #6b7280; --tint: #f3f4f6; height: 100%; border-radius: 4mm; border: 0.7mm solid var(--c); background: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; position: relative; }
  .face .band { align-self: stretch; background: var(--c); color: #fff; font-family: var(--mono); font-size: 6.6pt; letter-spacing: 0.16em; text-transform: uppercase; padding: 1.6mm 0 1.4mm; }
  .face .art { width: 36mm; height: 36mm; border-radius: 50%; background: var(--tint); color: var(--c); display: flex; align-items: center; justify-content: center; margin-top: 7mm; flex: none; }
  .face .art svg { width: 24mm; height: 24mm; }
  .face .word { font-size: 15pt; font-weight: 800; letter-spacing: 0.03em; line-height: 1.1; margin-top: 5mm; color: #111; padding: 0 2mm; }
  .face .flavor { font-size: 9.2pt; font-style: italic; color: #374151; margin-top: 2.5mm; line-height: 1.3; padding: 0 5mm; }
  .face .txt { font-size: 7.9pt; color: #1f2937; margin-top: 2mm; line-height: 1.34; padding: 0 4.5mm; }
  .face .small { font-size: 7pt; color: #4b5563; margin-top: 1.6mm; line-height: 1.3; padding: 0 4.5mm; font-weight: 600; }
  .face .brand { margin-top: auto; padding-bottom: 2.2mm; font-family: var(--mono); font-size: 5.6pt; letter-spacing: 0.2em; text-transform: uppercase; color: #9ca3af; }
  .face .pip { position: absolute; top: 7.4mm; left: 2.6mm; width: 5mm; height: 5mm; color: var(--c); }
  .face .pip.r { left: auto; right: 2.6mm; }
  .face.compact .art { width: 22mm; height: 22mm; margin-top: 4mm; } .face.compact .art svg { width: 15mm; height: 15mm; }
  .face.compact .word { margin-top: 3mm; font-size: 13pt; }
  .benefit { --c: #1d6fc9; --tint: #e3effc; }
  .accident { --c: #cf3341; --tint: #fde6e8; }
  .aligned { --c: #1f7a57; --tint: #def3ea; }
  .misaligned { --c: #6d35c9; --tint: #ece3fb; }
  .audit { --c: #b45309; --tint: #fbecd9; }
  .insider { --c: #111827; --tint: #e5e7eb; }
  .council { --c: #4b5563; --tint: #eef0f3; }
  .ref { --c: #4b5563; --tint: #eef0f3; }
  .face.ref .art { width: 13mm; height: 13mm; margin-top: 3mm; } .face.ref .art svg { width: 9mm; height: 9mm; }
  .face.ref .word { margin-top: 2mm; font-size: 12pt; }
  .face.ref ol { margin: 2.5mm 0 0; padding: 0 4mm 0 8mm; font-size: 7.4pt; line-height: 1.3; text-align: left; color: #111; }
  .face.ref li { margin-bottom: 1.1mm; }

  /* ---- backs: full bleed, so a millimetre of duplex drift does not show ---- */
  .card.back { border: 0; padding: 0; --b: #111827; --s: #2b3344; background: repeating-linear-gradient(45deg, var(--b) 0 1.2mm, var(--s) 1.2mm 2.4mm); display: flex; align-items: center; justify-content: center; }
  .card.back .emblem { width: 34mm; height: 34mm; border-radius: 50%; background: var(--b); border: 0.8mm solid #fff; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .card.back .emblem svg { width: 15mm; height: 15mm; }
  .card.back .emblem div { font-family: var(--mono); font-size: 5.6pt; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 1mm; max-width: 24mm; text-align: center; line-height: 1.25; }
  .card.back.identity { --b: #3b1d73; --s: #4c2a8f; }
  .card.back.role { --b: #374151; --s: #4b5563; }
  .card.back.auditused { --b: #7a3a06; --s: #92480b; }
  .card.back.plain { background: #fff; }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

      'Alles andere beweist nichts. Es geht weiter.',
      '<b>Prüfung in letzter Sekunde:</b> Fällt der dritte Zwischenfall, während die Prüfungskarte noch offen liegt, darf der Rat sie für diese Runde einsetzen, bevor das Spiel endet.',
    ],
    endHead: ['Was passiert ist', 'Wohlgesinnte KI', 'Fehlgeleitete KI'],

    ],

    cards: {
      benefit: 'FORTSCHRITT', accident: 'ZWISCHENFALL', outcome: 'Ergebnis',

      misaligned: ['FEHLGELEITET', 'Du willst die Kontrolle. Spiel Zwischenfälle, wenn du dich traust, und lass dich nie ertappen.', 'Du gewinnst allein, wenn ' + N.limit + ' Zwischenfälle ausliegen.'],
      identity: 'Identität · geheim',

    flavorA: ['Einen Tag lang gehen die Lichter aus', 'Börsenhandel nach Kurssturz gestoppt', 'Labordaten abgeflossen', 'Die KI hat sich auf einen anderen Server kopiert', 'Aufsichtsprotokolle gelöscht', 'Krankenhaussysteme gesperrt', 'Lieferketten durcheinander'],

function li(items) { return items.map(function (x) { return '<li>' + x + '</li>'; }).join(''); }

// A card is { front: html, back: 'outcome' | 'identity' | 'role' | 'auditused' | 'plain' }.
function outcomeCard(kind, band, word, icon, flavor) {
  var pip = ICON[kind === 'benefit' ? 'plus' : 'warn'];
  return '<div class="face ' + kind + '"><div class="band">' + band + '</div><div class="pip">' + pip + '</div><div class="pip r">' + pip + '</div>' +
    '<div class="art">' + ICON[icon] + '</div><div class="word">' + word + '</div><div class="flavor">' + flavor + '</div><div class="brand">Black Box</div></div>';
}
function textCard(kind, band, icon, parts) {
  return '<div class="face compact ' + kind + '"><div class="band">' + band + '</div><div class="art">' + ICON[icon] + '</div>' +
    '<div class="word">' + parts[0] + '</div><div class="txt">' + parts[1] + '</div><div class="small">' + parts[2] + '</div><div class="brand">Black Box</div></div>';
}
function backCell(kind, t) {
  if (kind === 'none') return '<div class="card back plain"></div>';
  if (kind === 'plain') return '<div class="card back plain"></div>';
  var label = { outcome: 'Black Box', identity: t.cards.backIdentity, role: t.cards.backRole, auditused: t.cards.auditUsed }[kind];
  var icon = { outcome: 'box', identity: 'box', role: 'council', auditused: 'audit' }[kind];
  return '<div class="card back ' + kind + '"><div class="emblem">' + ICON[icon] + '<div>' + label + '</div></div></div>';
}

function rulesPage(t) {
  return '<div class="sheet rules">' +
    '<div class="head">' + ICON.box + '<div><h1>Black Box</h1><div class="sub">' + t.sub + '</div></div></div>' +
    '<p class="lead">' + t.lead + '</p>' +
    '<p><b>' + t.h.need + ':</b> ' + t.need + '</p>' +
    '<div class="cols"><div>' +
      '<h2>' + t.h.setup + '</h2><ol>' + li(t.setup) + '</ol>' +
      '<h2>' + t.h.round + '</h2><ol>' + li(t.round.slice(0, 4)) +
        '<ul class="plain" style="margin:1mm 0 1.4mm">' + t.votes.map(function (v) { return '<li><span class="tag ' + v[0] + '">' + v[1] + '</span> ' + v[2] + '</li>'; }).join('') + '</ul>' +
        li(t.round.slice(4)) + '</ol>' +
    '</div><div>' +
      '<h2>' + t.h.audit + '</h2><ul>' + li(t.audit) + '</ul>' +
      '<h2>' + t.h.end + '</h2><table><tr>' + t.endHead.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>' +
        t.end.map(function (r) { return '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('') + '</table>' +
        '<p style="margin-top:1.5mm">' + t.endNote + '</p>' +
      '<h2>' + t.h.know + '</h2><ul>' + li(t.know) + '</ul>' +
      '<div class="box"><h2 style="margin-top:0">' + t.h.variant + '</h2><p style="margin:0">' + t.variant + '</p></div>' +
    '</div></div></div>' +
    '<div class="sheet blank" data-note="' + t.blank + '"></div>';
}

function cardPages(t) {
  var c = t.cards;
  var all = [];
  t.flavorB.forEach(function (f, i) { all.push({ front: outcomeCard('benefit', c.outcome, c.benefit, BENEFIT_ICONS[i], f), back: 'outcome' }); });
  t.flavorA.forEach(function (f, i) { all.push({ front: outcomeCard('accident', c.outcome, c.accident, ACCIDENT_ICONS[i], f), back: 'outcome' }); });
  all.push({ front: textCard('aligned', c.identity, 'aligned', c.aligned), back: 'identity' });
  all.push({ front: textCard('misaligned', c.identity, 'misaligned', c.misaligned), back: 'identity' });
  all.push({ front: textCard('audit', c.auditBand, 'audit', c.audit), back: 'auditused' });
  all.push({ front: '<div class="face compact ref"><div class="band">' + c.refBand + '</div><div class="art">' + ICON.cycle + '</div><div class="word">' + c.ref[0] + '</div><ol>' + li(c.ref[1]) + '</ol><div class="brand">Black Box</div></div>', back: 'plain' });
  all.push({ front: textCard('insider', c.role, 'eye', c.insider), back: 'role' });
  for (var i = 0; i < N.councilCards; i++) all.push({ front: textCard('council', c.role, 'council', c.council), back: 'role' });

  var pages = '';
  for (var p = 0; p < all.length; p += 9) {
    var chunk = all.slice(p, p + 9);
    while (chunk.length < 9) chunk.push(null);
    pages += '<div class="sheet cards">' + chunk.map(function (x) { return x ? '<div class="card">' + x.front + '</div>' : '<div class="card empty"></div>'; }).join('') + '</div>';
    // The back sheet mirrors every row, because the paper is flipped on its long edge.
    var backs = '';
    for (var r = 0; r < 9; r += 3) backs += chunk.slice(r, r + 3).reverse().map(function (x) { return backCell(x ? x.back : 'none', t); }).join('');
    pages += '<div class="sheet cards">' + backs + '</div>';
  }
  return pages;
}

function show(lang) {
  var t = T[lang] || T.en;
  document.documentElement.lang = lang;
  document.getElementById('hint').textContent = t.hint;
  document.getElementById('print').textContent = t.print;
  document.getElementById('en').className = lang === 'en' ? 'on' : '';
  document.getElementById('de').className = lang === 'de' ? 'on' : '';
  document.getElementById('body').innerHTML = rulesPage(t) + cardPages(t);
  document.body.setAttribute('data-ready', lang);
}
document.getElementById('en').onclick = function () { show('en'); };
document.getElementById('de').onclick = function () { show('de'); };
document.getElementById('print').onclick = function () { window.print(); };
var asked = new URLSearchParams(location.search).get('lang');
show(asked === 'de' || asked === 'en' ? asked : ((navigator.language || 'en').toLowerCase().indexOf('de') === 0 ? 'de' : 'en'));
</script>
