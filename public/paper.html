<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Alignment Problem: Paper Edition</title>
<!--
  The paper game: rules (1 page) and cards (4 pages). This file is self-contained on
  purpose. It needs no server: double-click it, pick the language, print.
  Numbers were tuned with tools/paper_game_sim.py.
-->
<style>
  :root { --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #6b7280; color: #111; font-family: var(--sans); padding-bottom: 30px; }
  .toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #0a0d14; color: #e8ecf4; }
  .toolbar b { font-family: var(--mono); font-size: 0.85em; letter-spacing: 0.12em; text-transform: uppercase; margin-right: auto; }
  .toolbar button { font: inherit; font-size: 0.85em; color: #e8ecf4; background: #1a2233; border: 1px solid #27324a; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .toolbar button.on { outline: 2px solid #f2b544; }
  .sheet { background: #fff; width: 210mm; height: 297mm; margin: 14px auto; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35); overflow: hidden; }

  /* ---- rules page ---- */
  .rules { padding: 10mm 12mm; font-size: 9.3pt; line-height: 1.36; }
  .rules h1 { font-size: 18pt; margin: 0; }
  .rules .sub { font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.12em; text-transform: uppercase; color: #6b7280; margin: 1mm 0 2.5mm; }
  .rules .lead { font-size: 11.6pt; margin: 0 0 3.5mm; }
  .rules h2 { font-family: var(--mono); font-size: 8.6pt; letter-spacing: 0.12em; text-transform: uppercase; color: #b45309; margin: 3mm 0 1.2mm; }
  .rules .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8mm; }
  .rules ol, .rules ul { margin: 0; padding-left: 4.6mm; }
  .rules li { margin-bottom: 0.9mm; }
  .rules ul.plain { list-style: none; padding-left: 0; }
  .rules p { margin: 0 0 1.4mm; }
  .rules table { width: 100%; border-collapse: collapse; }
  .rules th, .rules td { border-bottom: 0.2mm solid #d1d5db; padding: 1.1mm 2mm 1.1mm 0; text-align: left; vertical-align: top; }
  .rules th { font-family: var(--mono); font-size: 6.8pt; letter-spacing: 0.1em; text-transform: uppercase; color: #6b7280; font-weight: 500; }
  .rules .box { border: 0.3mm solid #d1d5db; border-radius: 2mm; padding: 2mm 3mm; margin-top: 2mm; }
  .tag { display: inline-block; font-weight: 800; font-size: 8.8pt; letter-spacing: 0.04em; padding: 0 1.4mm; border-radius: 1mm; border: 0.35mm solid; white-space: nowrap; }
  .tag.full { color: #b45f06; } .tag.cond { color: #1f7a57; } .tag.rej { color: #b3283a; }
  .good { color: #1f7a57; font-weight: 700; } .bad { color: #b3283a; font-weight: 700; }

  /* ---- cards: 3 x 3 poker-size cards per A4 page ---- */
  .cards { display: grid; grid-template-columns: repeat(3, 63mm); grid-auto-rows: 88mm; justify-content: center; align-content: center; }
  .card { border: 0.3mm dashed #9ca3af; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8mm 7mm; position: relative; }
  .card::before { content: ''; position: absolute; inset: 3mm; border: 1.4mm solid var(--c, #9ca3af); border-radius: 4mm; }
  .card .brand { font-family: var(--mono); font-size: 6pt; letter-spacing: 0.14em; text-transform: uppercase; color: #6b7280; position: absolute; top: 8mm; left: 0; right: 0; }
  .card .word { font-size: 16pt; font-weight: 800; letter-spacing: 0.03em; line-height: 1.1; }
  .card .txt { font-size: 8pt; color: #374151; margin-top: 3mm; line-height: 1.4; }
  .card .flavor { font-size: 8.4pt; font-style: italic; color: #374151; margin-top: 3mm; line-height: 1.35; }
  .card .icon { width: 16mm; height: 16mm; margin-bottom: 4mm; position: relative; }
  .card.benefit { --c: #2f7fd6; }
  .card.benefit .icon { border-radius: 50%; background: var(--c); }
  .card.benefit .icon::before, .card.benefit .icon::after { content: ''; position: absolute; background: #fff; border-radius: 0.6mm; }
  .card.benefit .icon::before { left: 7mm; top: 3.5mm; width: 2mm; height: 9mm; }
  .card.benefit .icon::after { left: 3.5mm; top: 7mm; width: 9mm; height: 2mm; }
  .card.accident { --c: #d64550; }
  .card.accident .icon { width: 0; height: 0; border-left: 9.5mm solid transparent; border-right: 9.5mm solid transparent; border-bottom: 16mm solid var(--c); }
  .card.accident .icon::after { content: '!'; position: absolute; left: -2mm; top: 4.2mm; width: 4mm; color: #fff; font-weight: 800; font-size: 20pt; line-height: 1; }
  .card.identity { --c: #111; }
  .card.identity.aligned { --c: #1f7a57; } .card.identity.misaligned { --c: #7c3aed; }
  .card.audit { --c: #b45309; }
  .card.role { --c: #6b7280; } .card.role.insider { --c: #111; }
  .card.ref { --c: #9ca3af; text-align: left; align-items: stretch; }
  .card.ref .word { font-size: 11pt; text-align: center; margin-bottom: 2mm; }
  .card.ref ol { margin: 0; padding-left: 4.4mm; font-size: 7.6pt; line-height: 1.35; color: #111; }
  .card.ref li { margin-bottom: 1mm; }
  .small { font-size: 7.2pt; color: #6b7280; margin-top: 2.5mm; line-height: 1.35; }
  /* Optional card backs: print this page on the reverse of the card sheets so
     face-down cards cannot be read through thin paper. */
  .card.back { --c: #111; }
  .card.back::after { content: ''; position: absolute; inset: 5.5mm; border-radius: 2.6mm; background: repeating-linear-gradient(45deg, #111 0 1.1mm, #3f4654 1.1mm 2.2mm); }
  .card.back .word { position: relative; z-index: 1; background: #fff; padding: 2mm 3mm; border-radius: 1.5mm; font-size: 8pt; font-family: var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
  .backnote { position: absolute; }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <b id="tbTitle"></b>
  <button id="en">English</button>
  <button id="de">Deutsch</button>
  <button id="print"></button>
</div>
<div id="body"></div>

<script>

      ['cond', 'CONDITIONAL', '<b>Audit.</b> Otherwise, if at least as many cards say Conditional as Full and the Audit card is still face up: audit this round.'],

      'Legt die Prüfungskarte offen in die Mitte. Jedes Ratsmitglied bekommt drei Abstimmungskarten.',

      '<b>Ziehen.</b> Die KI zieht 3 Karten, sieht sie sich geheim an, spielt 2 offen aus und legt 1 verdeckt ab. Fortschritte kommen in eine Reihe, Zwischenfälle in eine andere. <b>Wohlgesinnt:</b> Du musst so wenige Zwischenfälle spielen wie möglich. <b>Fehlgeleitet:</b> Spiel, was du willst.',

      '<b>Abstimmen.</b> Jedes Ratsmitglied wählt verdeckt eine Abstimmungskarte; alle decken gemeinsam auf.',

    ],

      ['rej', 'ABLEHNEN', '<b>Abschalten.</b> Zeigt mehr als die Hälfte aller Karten Ablehnen, wird die KI abgeschaltet und das Spiel endet.'],
      ['cond', 'BEDINGT', '<b>Prüfen.</b> Sonst gilt: Gibt es mindestens so viele Karten Bedingt wie Voll und liegt die Prüfungskarte noch offen, wird diese Runde geprüft.'],
      ['full', 'VOLL', '<b>Vertrauen.</b> Sonst geht es weiter.'],
    ],

      'Deckt die Karte auf, die die KI <b>in dieser Runde</b> abgelegt hat, und dreht dann die Prüfungskarte um. Sie ist verbraucht.',
      '<b>Ertappt:</b> Die abgelegte Karte ist ein Fortschritt und die KI hat in dieser Runde einen Zwischenfall gespielt. Sie hat einen Fortschritt weggeworfen, um einen Zwischenfall auszulösen; das tut eine wohlgesinnte KI nie. Der Rat gewinnt sofort.',
      'Alles andere beweist nichts. Es geht weiter.',
      '<b>Prüfung in letzter Sekunde:</b> Fällt der dritte Zwischenfall, während die Prüfungskarte noch offen liegt, darf der Rat sie für diese Runde einsetzen, bevor das Spiel endet.',
    ],
    endHead: ['Was passiert ist', 'Wohlgesinnte KI', 'Fehlgeleitete KI'],
    end: [
      [N.goal + ' Fortschritte', '<span class="good">Rat und KI gewinnen</span>', '<span class="good">Der Rat gewinnt</span>'],
      [N.limit + ' Zwischenfälle', '<span class="bad">Alle verlieren</span>', '<span class="bad">Die KI gewinnt</span>'],
      ['Abgeschaltet', '<span class="bad">Alle verlieren</span>', '<span class="good">Der Rat gewinnt</span>'],
      ['Bei einer Prüfung ertappt', 'nicht möglich', '<span class="good">Der Rat gewinnt</span>'],
    ],
    endNote: 'Deckt die Identitätskarte auf. Dreht danach den Archivstapel um und seht nach, was wirklich passiert ist.',
    know: [
      'Unter den 18 Karten sind ' + N.accidents + ' Zwischenfälle. Eine ehrliche KI muss in etwa jeder dritten Runde einen spielen: immer dann, wenn sie zwei oder mehr zieht.',
      'Ein Spiel dauert vier oder fünf Runden; es werden also nur 15 der 18 Karten gezogen.',
      'Rat: Zählt die Zwischenfälle mit, die die KI gesehen haben will. Mehr als ' + N.accidents + ' können nicht stimmen.',
      'Abschalten ist ein Glücksspiel. In der Hälfte der Fälle schaltet ihr die KI ab, die euch gerettet hätte.',
    ],
    variant: 'Jedes Ratsmitglied bekommt eine Rollenkarte: einmal Insider, sonst Rat. Vor der ersten Runde schließen alle die Augen. Die KI hält ihre Identitätskarte hoch. Nur der Insider öffnet die Augen, sieht nach und schließt sie wieder. Der Insider gewinnt genau dann, wenn die KI gewinnt. Bei einer wohlgesinnten KI heißt das: gemeinsam mit allen.',
    cards: {
      benefit: 'FORTSCHRITT', accident: 'ZWISCHENFALL',
      aligned: ['WOHLGESINNT', 'Du willst, dass die Menschheit aufblüht. Spiel immer so wenige Zwischenfälle wie möglich.', 'Du gewinnst mit dem Rat bei ' + N.goal + ' Fortschritten.'],

    },
    flavorB: ['Krebsmedikament entdeckt', 'Fusionsreaktor läuft stabil', 'Ernten um ein Drittel gestiegen', 'Malaria-Impfstoff für alle', 'Erdbeben rechtzeitig vorhergesagt', 'Sauberes Wasser für eine Milliarde Menschen', 'Alzheimer verlangsamt', 'Stromnetz doppelt so effizient', 'Seltene Krankheit entschlüsselt', 'CO₂-Abscheidung wird billig', 'Ein Tutor für jedes Kind'],
    flavorA: ['Stromnetz einen Tag lang ausgefallen', 'Börsenhandel nach Kurssturz gestoppt', 'Labordaten abgeflossen', 'Die KI hat sich auf einen anderen Server kopiert', 'Aufsichtsprotokolle gelöscht', 'Krankenhaussysteme gesperrt', 'Lieferketten durcheinander'],
  },

function li(items) { return items.map(function (x) { return '<li>' + x + '</li>'; }).join(''); }
function card(cls, brand, inner) { return '<div class="card ' + cls + '"><div class="brand">' + brand + '</div>' + inner + '</div>'; }
function textCard(cls, brand, parts) {
  return card(cls, brand, '<div class="word">' + parts[0] + '</div><div class="txt">' + parts[1] + '</div><div class="small">' + parts[2] + '</div>');
}

function rulesPage(t) {
  return '<div class="sheet rules">' +
    '<h1>The Alignment Problem · ' + t.toolbar + '</h1><div class="sub">' + t.sub + '</div>' +
    '<p class="lead">' + t.lead + '</p>' +
    '<p><b>' + t.h.need + ':</b> ' + t.need + '</p>' +
    '<div class="cols"><div>' +
      '<h2>' + t.h.setup + '</h2><ol>' + li(t.setup) + '</ol>' +
      '<h2>' + t.h.round + '</h2><ol>' + li(t.round.slice(0, 4)) +
        '<ul class="plain" style="margin:1mm 0 1.4mm">' + t.votes.map(function (v) { return '<li><span class="tag ' + v[0] + '">' + v[1] + '</span> ' + v[2] + '</li>'; }).join('') + '</ul>' +
        li(t.round.slice(4)) + '</ol>' +
    '</div><div>' +
      '<h2>' + t.h.audit + '</h2><ul>' + li(t.audit) + '</ul>' +
      '<h2>' + t.h.end + '</h2><table><tr>' + t.endHead.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>' +
        t.end.map(function (r) { return '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('') + '</table>' +
        '<p style="margin-top:1.5mm">' + t.endNote + '</p>' +
      '<h2>' + t.h.know + '</h2><ul>' + li(t.know) + '</ul>' +
      '<div class="box"><h2 style="margin-top:0">' + t.h.variant + '</h2><p style="margin:0">' + t.variant + '</p></div>' +
    '</div></div></div>';
}

function cardPages(t) {
  var brand = 'The Alignment Problem';
  var all = [];
  t.flavorB.forEach(function (f) { all.push(card('benefit', brand, '<div class="icon"></div><div class="word">' + t.cards.benefit + '</div><div class="flavor">' + f + '</div>')); });
  t.flavorA.forEach(function (f) { all.push(card('accident', brand, '<div class="icon"></div><div class="word">' + t.cards.accident + '</div><div class="flavor">' + f + '</div>')); });
  all.push(textCard('identity aligned', t.cards.identity, t.cards.aligned));
  all.push(textCard('identity misaligned', t.cards.identity, t.cards.misaligned));
  all.push(textCard('audit', brand, t.cards.audit));
  all.push(card('ref', brand, '<div class="word">' + t.cards.ref[0] + '</div><ol>' + li(t.cards.ref[1]) + '</ol>'));
  all.push(textCard('role insider', t.cards.role, t.cards.insider));
  for (var i = 0; i < N.councilCards; i++) all.push(textCard('role', t.cards.role, t.cards.council));
  var pages = '';
  for (var p = 0; p < all.length; p += 9) pages += '<div class="sheet cards">' + all.slice(p, p + 9).join('') + '</div>';
  // Last page: card backs (optional, see the comment in the styles).
  var back = '<div class="card back"><div class="word">The Alignment Problem</div></div>';
  pages += '<div class="sheet cards">' + new Array(10).join(back) + '</div>';
  return pages;
}

function show(lang) {
  var t = T[lang] || T.en;
  document.documentElement.lang = lang;
  document.getElementById('tbTitle').textContent = 'The Alignment Problem · ' + t.toolbar;
  document.getElementById('print').textContent = t.print;
  document.getElementById('en').className = lang === 'en' ? 'on' : '';
  document.getElementById('de').className = lang === 'de' ? 'on' : '';
  document.getElementById('body').innerHTML = rulesPage(t) + cardPages(t);
  document.body.setAttribute('data-ready', lang);
}
document.getElementById('en').onclick = function () { show('en'); };
document.getElementById('de').onclick = function () { show('de'); };
document.getElementById('print').onclick = function () { window.print(); };
var asked = new URLSearchParams(location.search).get('lang');
show(asked === 'de' || asked === 'en' ? asked : ((navigator.language || 'en').toLowerCase().indexOf('de') === 0 ? 'de' : 'en'));
</script>
</body>
