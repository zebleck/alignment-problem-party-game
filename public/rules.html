<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Alignment Problem: Rulebook</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* Two A4 pages, meant to be printed double-sided. */
  @page { size: A4 portrait; margin: 10mm; }
  @media print {
    body { padding: 0 !important; }
    .rules { columns: 2; column-gap: 6mm; font-size: 9.4pt; line-height: 1.3; }
    .rules section { padding: 2.6mm 3.4mm; margin-bottom: 3mm; }
    .rules-head h2 { color: #000; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body style="padding:18px 22px">
<div class="rules-head">
  <h2 id="title"></h2>
  <div style="display:flex;gap:8px">
    <button class="rules-btn" id="en">English</button>
    <button class="rules-btn" id="de">Deutsch</button>
    <button class="rules-btn" id="print"></button>
  </div>
</div>
<div id="body" class="muted">…</div>
<script type="module">
import { $, t, setLang } from '/common.js';
import { loadRules, rulesHtml } from '/rules.js';

// Opens in the table's current language; ?lang=de or the buttons override it.
async function show(lang) {
  const r = await loadRules(lang);
  setLang(r.language);
  document.documentElement.lang = r.language; // so that long words are hyphenated by the right rules in print
  $('#title').textContent = `The Alignment Problem · ${t('Rulebook')}`;
  $('#print').textContent = t('Print');
  $('#en').classList.toggle('selected', r.language === 'en');
  $('#de').classList.toggle('selected', r.language === 'de');
  $('#body').className = '';
  $('#body').innerHTML = rulesHtml(r);
}
$('#en').onclick = () => show('en');
$('#de').onclick = () => show('de');
$('#print').onclick = () => print();
show(new URLSearchParams(location.search).get('lang') || 'table');
</script>
</body>
</html>
