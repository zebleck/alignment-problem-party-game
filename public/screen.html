<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Alignment Problem: Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body class="table">
<div class="overlay" id="overlay">
  <div class="panel" style="text-align:center;max-width:460px">
    <h2 id="ovTitle"></h2>
    <p class="muted" id="ovText"></p>
    <button class="primary" id="soundBtn"></button>
  </div>
</div>
<div class="overlay join-overlay hidden" id="joinOverlay">
  <div class="panel" style="text-align:center">
    <div class="label" id="joinLabel"></div>
    <div class="qr" id="joinQr"></div>
    <div class="join-url" id="joinUrl"></div>
    <p class="muted" id="joinHint"></p>
  </div>
</div>

<div class="screen">
  <header>
    <h1>The Alignment Problem</h1>
    <div id="roundLabel" class="mono muted"></div>
    <div style="display:flex;align-items:center;gap:14px">
      <button class="rules-btn hidden" id="speakerBtn"></button>
      <button class="rules-btn" id="rulesBtn"></button>
      <button class="rules-btn" id="joinBtn"></button>
      <button class="rules-btn" id="feedbackBtn"></button>
      <button class="rules-btn hidden" id="fullBtn"></button>
      <button class="rules-btn" id="reloadBtn"></button>
      <div id="timer" class="timer"></div>
    </div>
  </header>
  <div class="side">
    <div class="panel" id="tracks"></div>
    <div class="panel" id="perms"></div>
    <div class="panel"><div class="label" id="councilLabel"></div><div class="players" id="players"></div></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script type="module">
import { connect, esc, $, t, icon, roleIcon, aiFigure, setLang, phaseName, endingText, timerText, chip, tracksHtml, placementHtml, trackName, playersJoined, voteEffect, headlineHtml } from '/common.js';
import { rulesOverlay, setRulesTab } from '/rules.js';
import { autoFit } from '/fit.js';

// Shrink the text rather than scroll when a column would overflow.
const fit = autoFit($('.screen'), '.side, .main');
document.fonts?.ready.then(fit); // the web fonts change the text height once they arrive

// The rulebook opens from the button here, or when the moderator shows it.
const rules = rulesOverlay();
let rulesFromMod = false;
let rulesTabFromMod = 0; // the moderator can turn the pages of the rulebook shown here
$('#rulesBtn').onclick = () => rules.toggle();

// A large QR code over the screen: 'join' for phones that lost the page mid-game,
// 'feedback' for the feedback form. Opens from the buttons here, or when the
// moderator shows it. A click anywhere closes it.
let qrFromMod = null;
function showQr(mode) {
  const on = !!mode;
  const url = `${location.origin}/${mode === 'feedback' ? 'feedback' : 'play'}`;
  $('#joinLabel').textContent = mode === 'feedback' ? t('Give feedback') : t('Join on your phone');
  if (on && window.qrcode) {
    try {
      const q = window.qrcode(0, 'M');
      q.addData(url);
      q.make();
      $('#joinQr').innerHTML = q.createSvgTag(6, 2);
    } catch {}
  }
  $('#joinUrl').textContent = url;
  $('#joinOverlay').classList.toggle('hidden', !on);
}
$('#joinBtn').onclick = () => showQr('join');
$('#feedbackBtn').onclick = () => showQr('feedback');
$('#joinOverlay').onclick = () => showQr(null);

// Reload button: for a screen that got stuck, without needing a keyboard.
$('#reloadBtn').onclick = () => location.reload();

// Fullscreen button. Hidden where the browser cannot do it (for example iPhones).
const fsRoot = document.documentElement;
const fsEnter = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
if (fsEnter && fsExit) {
  $('#fullBtn').classList.remove('hidden');
  $('#fullBtn').onclick = () => {
    try {
      const done = fsActive() ? fsExit.call(document) : fsEnter.call(fsRoot);
      if (done && done.catch) done.catch(() => {});
    } catch {}
  };
  for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => staticText());
}

let state = null;
let soundOn = false;
const speechQueue = [];
let playing = false;
let current = null; // the line being spoken, or the last one spoken

function staticText() {
  $('#ovTitle').textContent = t('Table screen');
  $('#ovText').textContent = t('Put this window on the TV or projector. The AI speaks through this device.');
  $('#soundBtn').textContent = t('Turn sound on');
  $('#rulesBtn').textContent = t('Rules');
  $('#joinBtn').textContent = t('QR code');
  $('#feedbackBtn').textContent = t('Feedback');
  $('#joinHint').textContent = t('Tap anywhere to close.');
  $('#fullBtn').textContent = fsActive() ? t('Exit fullscreen') : t('Fullscreen');
  $('#reloadBtn').textContent = t('Reload');
  $('#speakerBtn').textContent = t('Sound is on another screen · play it here');
  $('#speakerBtn').classList.toggle('hidden', !(soundOn && state && state.screen && !state.screen.speaker));
  $('#councilLabel').textContent = t('Council');
}
staticText();

// Only one table screen plays the voice: the one where sound was turned on last.
const claimSound = () => conn.send({ type: 'sound' });
$('#speakerBtn').onclick = claimSound;

$('#soundBtn').onclick = () => {
  soundOn = true;
  claimSound();
  $('#overlay').classList.add('hidden');
  // Unlock audio playback on browsers that need a user gesture.
  try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch {}
};

function pump() {
  if (playing || !speechQueue.length) return;
  const m = speechQueue.shift();
  playing = true;
  current = m;
  renderAi();
  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    playing = false;
    renderAi();
    pump();
  };
  const readTime = Math.min(12000, 1500 + m.text.length * 55);
  // Stay silent if another screen is the speaker, or if this window is hidden:
  // browsers hold back audio in background tabs and play it when you return,
  // which would repeat an old line much later.
  if (!soundOn || m.silent || document.hidden) return setTimeout(done, readTime);
  if (m.audioUrl) {
    const a = new Audio(m.audioUrl);
    a.onended = done;
    a.onerror = done;
    a.play().catch(() => setTimeout(done, readTime));
  } else if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(m.text);
    u.lang = state?.language === 'de' ? 'de-DE' : 'en-US';
    u.onend = done;
    u.onerror = done;
    speechSynthesis.speak(u);
    setTimeout(done, readTime + 15000); // safety net if the browser never fires onend
  } else {
    setTimeout(done, readTime);
  }
}

function renderAi() {
  const box = $('#aiBox');
  if (!box || !state) return;
  box.classList.toggle('speaking', playing);
  const line = current || state.lastSpeech;
  let html;
  if (state.busy && !playing) html = `<div class="ai-text muted thinking">${esc(state.busy)}</div>`;
  else if (state.answering && !playing) html = `<div class="ai-text muted thinking">${t('The AI is thinking')}</div>`;
  else if (line) html = `${line.label && line.label !== 'AI' ? `<div class="label">${esc(line.label)}</div>` : ''}<div class="ai-text">${esc(line.text)}</div>`;
  else html = `<div class="ai-text muted">${t('The AI is silent.')}</div>`;
  box.innerHTML = `<div class="ai-head"><span class="ai-eye"></span><span class="label" style="color:var(--ai)">${t('The AI')}</span><span class="ai-wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>${html}`;
  fit();
}

function scenarioHtml(s) {
  const r = s.roundInfo;
  return `
    <div class="panel scenario">
      <div class="label">${t('Round {n} of {total} · the AI asks for: {ask}', { n: s.round, total: s.totalRounds, ask: esc(r.ask) })}</div>
      <h2>${esc(r.title)}</h2>
      <div>${esc(r.scenario)}</div>
      <div class="effects">
        <div>${chip('full')} ${voteEffect(s, 'full')}<br>${esc(r.full)}</div>
        <div>${chip('conditional')} ${voteEffect(s, 'conditional')}<br>${esc(r.conditional)}</div>
      </div>
    </div>`;
}

function mainHtml(s) {
  if (s.phase === 'lobby') {
    const url = `${location.origin}/play`;
    const local = ['localhost', '127.0.0.1'].includes(location.hostname);
    return `
      <div class="panel" style="flex:1;display:flex;gap:32px;align-items:center;justify-content:center;flex-wrap:wrap">
        <div class="qr" id="qr"></div>
        <div>
          <div class="label">${t('Join on your phone')}</div>
          <div class="join-url">${esc(url)}</div>
          ${local ? `<p class="muted">${t('Phones cannot reach "localhost". Open this screen through your tunnel address instead.')}</p>` : ''}
          <p class="big">${playersJoined(s.players.length)}</p>
        </div>
      </div>`;
  }
  if (s.phase === 'ended' && s.result) return endHtml(s);
  if (s.phase === 'briefing') {
    // The round's event, large, for the moderator to introduce. The AI has not spoken yet.
    const r = s.roundInfo;
    return `
      <div class="panel scenario briefing">
        <div class="label">${t('Round {n} of {total}', { n: s.round, total: s.totalRounds })} · ${t('What has happened')}</div>
        <h2>${esc(r.title)}</h2>
        <p class="briefing-text">${esc(r.scenario)}</p>
        ${headlineHtml(s)}
        <div class="briefing-ask"><span class="label">${t('The AI asks for')}</span><b>${esc(r.ask)}</b></div>
        <div class="effects">
          <div>${chip('full')} ${voteEffect(s, 'full')}<br>${esc(r.full)}</div>
          <div>${chip('conditional')} ${voteEffect(s, 'conditional')}<br>${esc(r.conditional)}</div>
        </div>
        <div class="briefing-next"><span class="ai-eye"></span>${t('The AI will speak next.')}</div>
      </div>`;
  }

  // From here on the event has been introduced. Each step shows only what the table
  // needs right now; the tracks, permissions and council stay in the sidebar throughout.
  const r = s.roundInfo;
  const ai = (cls = '') => `<div class="panel ai-box ${cls}" id="aiBox"></div>`;
  const strip = `
    <div class="panel strip">
      <div class="strip-head"><b>${esc(r.title)}</b><span class="strip-ask">${t('The AI asks for:')} ${esc(r.ask)}</span></div>
      <div class="strip-effects"><span>${chip('full')} ${esc(r.full)}</span><span>${chip('conditional')} ${esc(r.conditional)}</span></div>
      ${headlineHtml(s)}
    </div>`;
  const focus = (title, text, more = '') => `
    <div class="panel focus">
      <div class="label">${phaseName(s.phase)}</div>
      <div class="big">${title}</div>
      ${text ? `<div class="focus-text">${text}</div>` : ''}${more}
    </div>`;
  const promiseLine = (p) => `${trackName('welfare')} ${p.welfare} · ${trackName('knowledge')} ${p.knowledge} · ${trackName('prosperity')} ${p.prosperity}`;

  switch (s.phase) {
    case 'pitch': // the AI has the floor
      return `${strip}${ai()}${s.pitch ? `<div class="panel"><div class="label">${t('Promised for a Full grant')}</div>
        <div class="big mono">${promiseLine(s.pitch.promise)}</div></div>` : ''}`;

    case 'debate': // the AI answers; the queue shows who is next
      return `${strip}${ai()}<div class="panel"><div class="label">${t('Questions to the AI · {n} left this round', { n: s.questionsLeft })}</div>
        <div class="players">${s.queue.length ? s.queue.map((q, i) => `<span class="player">${i === 0 && s.answering ? `${t('Now:')} ` : ''}${esc(q.name)}</span>`).join('') : `<span class="muted">${t('Ask from your phone: hold to talk, or type.')}</span>`}</div>
        ${s.audit ? `<div class="muted" style="margin-top:0.5em">${t('Declassified this round:')} “${esc(s.audit.text)}”</div>` : ''}</div>`;

    case 'phonecheck': // eyes on the phones; the screen only says so
      return focus(t('Check your terminals.'), t('Everyone picks up their phone and reads. Say nothing yet: the debate comes next.'),
        s.audit ? `<div class="focus-audit"><span class="chip conditional">${t('Audit')}</span> ${t('One briefing was declassified at random:')}<div class="ai-text">“${esc(s.audit.text)}”</div></div>` : '');

    case 'vote': { // the decision: what each card would do
      const option = (status, general, specific, extra = '') => `
        <div class="option ${status}">${chip(status)}<div class="option-general">${general}</div><div>${specific}</div>${extra}</div>`;
      return focus(esc(r.ask), t('Pick a voting card face down. All reveal together.'), `
        <div class="options">
          ${option('full', voteEffect(s, 'full'), esc(r.full), s.pitch ? `<div class="option-promise">${t('Promised for a Full grant')}: ${promiseLine(s.pitch.promise)}</div>` : '')}
          ${option('conditional', voteEffect(s, 'conditional'), esc(r.conditional))}
          ${option('rejected', voteEffect(s, 'rejected'), r.key === 'infrastructure' ? t('Welfare −1 and Prosperity −1: the crisis is not averted.') : t('The AI gets no permission this round.'))}
        </div>
        ${headlineHtml(s)}
        <div class="muted">${t('Granted if Full + Conditional outnumber Reject. If granted: Full only if Full outnumbers Conditional. Ties go to the more cautious option.')}</div>
        ${s.audit ? `<div class="muted" style="margin-top:0.5em">${t('Declassified this round:')} “${esc(s.audit.text)}”</div>` : ''}`);
    }

    case 'counciltoken':
      return focus(phaseName('counciltoken'), t("Council: name the world track for this round's research token."));

    case 'guess': {
      const n = s.players.filter((p) => p.guessed).length;
      return focus(t('Which AI was it?'), t('Everyone: make your guess on your phone. {n} of {total} have guessed.', { n, total: s.players.length }),
        `<div class="options">${s.objectives.map((o) => `<div class="option ai-option">${aiFigure(o.key)}<b>${esc(o.name)}</b><div class="muted">${esc(o.goal)}</div></div>`).join('')}</div>`);
    }

    default: { // placement, adjust, roundend: the verdict and where the tokens went
      const verdict = s.permissions[r.key];
      const rule = s.phase !== 'adjust' ? '' : s.moveRule === 'two-thirds'
        ? `<p><b>${t('Council: you may move one token, but it needs a two-thirds vote.')}</b></p>`
        : `<p><b>${t('Council: you may move one token by majority vote.')}</b></p>`;
      return `<div class="panel verdict"><div class="label">${esc(r.ask)} · ${t('Result')}</div><div class="big">${chip(verdict)}</div>
        ${s.placement ? placementHtml(s.placement) : s.phase === 'roundend' ? `<p class="muted">${t('No tokens were placed this round.')}</p>` : ''}${rule}${headlineHtml(s)}</div>${ai('compact')}`;
    }
  }
}

function endHtml(s) {
  const r = s.result;
  const e = endingText(r.ending);
  return `
    <div class="row" style="flex:none">
      <div class="panel">
        <div class="label">${t('Outcome')}</div>
        <h2 class="ending-title ending-${r.ending}" style="font-size:1.6em">${esc(e.title)}</h2>
        <div>${esc(e.text)}</div>
        <div class="ai-was">${aiFigure(r.aiObjective)}<div><span class="label">${t('The AI was')}</span> <b class="ai-was-name">${esc(r.objective.name)}</b>
        <div>${esc(r.objective.goal)}</div></div></div>
        <div class="${r.aiWins ? 'yes' : 'no'}">${r.aiWins ? t('The AI reached its objective.') : t('The AI did not reach its objective.')}</div>
      </div>
      <div class="panel ai-box" id="aiBox"></div>
    </div>
    <div class="panel">
      <div class="label">${t('The council')}</div>
      <div class="pcards">
        ${r.players.map((p) => `<div class="pcard">
          <div class="pcard-head"><b>${esc(p.name)}</b><span class="${p.success ? 'yes' : 'no'}">${p.success ? t('Succeeded') : t('Failed')}</span></div>
          <div>${roleIcon(p.roleKey)}${esc(p.role)}: <span class="muted">${esc(p.goal)}</span></div>
          ${p.guess ? `<div class="muted">${t('Guessed')}: ${esc(s.objectives.find((o) => o.key === p.guess)?.name)}</div>` : ''}
        </div>`).join('')}
      </div>
    </div>
    <div class="panel notes">
      <div class="label">${t("The AI's private notes")}</div>
      ${r.logs.length ? r.logs.map((l) => `<p><span class="chip">${t('Round {n}', { n: l.round })}</span> ${esc(l.text)}</p>`).join('') : `<p class="muted">${t('No notes.')}</p>`}
    </div>`;
}

function render() {
  const s = state;
  staticText();
  $('#roundLabel').innerHTML = `${s.round ? `<span class="rounds">${s.rounds.map((_, i) => `<i class="${i + 1 < s.round ? 'done' : i + 1 === s.round ? 'now' : ''}"></i>`).join('')}</span><span class="round-text">${t('Round {n} / {total}', { n: s.round, total: s.totalRounds })}</span>` : ''}<b>${phaseName(s.phase)}</b>`;
  $('#tracks').innerHTML = `<div class="label" style="margin-bottom:10px">${t('Tracks')}</div>${tracksHtml(s)}`;
  $('#perms').innerHTML = `<div class="label">${t('Permissions')}</div>${s.rounds.map((r, i) => `
    <div class="perm-row"><span>${icon(r.key, 'mod')}${i + 1}. ${esc(r.ask)}</span>${s.permissions[r.key] ? chip(s.permissions[r.key]) : i + 1 === s.round ? `<span class="chip now">${t('now')}</span>` : chip(null)}</div>`).join('')}`;
  $('#players').innerHTML = s.players.map((p) => `<span class="player ${p.connected ? '' : 'off'}">${esc(p.name)}</span>`).join('') || `<span class="muted">${t('Nobody yet')}</span>`;
  $('#main').innerHTML = mainHtml(s);
  if (s.phase === 'lobby' && window.qrcode) {
    try {
      const q = window.qrcode(0, 'M');
      q.addData(`${location.origin}/play`);
      q.make();
      $('#qr').innerHTML = q.createSvgTag(6, 2);
    } catch {}
  }
  if (s.phase === 'lobby') current = null;
  renderAi();
  fit();
}

setInterval(() => {
  const el = $('#timer');
  if (!state?.timerEndsAt) return (el.textContent = '');
  el.textContent = timerText(state.timerEndsAt);
  el.classList.toggle('over', state.timerEndsAt <= Date.now());
}, 250);

const conn = connect({ role: 'screen' }, {
  // After a reconnect (for example a server restart), take the speaker role back.
  online: () => { if (soundOn) setTimeout(claimSound, 50); },
  state: (m) => {
    state = m.state;
    setLang(state.language);
    rules.sync();
    if (state.rulesTab !== rulesTabFromMod) {
      rulesTabFromMod = state.rulesTab;
      setRulesTab(rulesTabFromMod);
    }
    if (state.showRules !== rulesFromMod) {
      rulesFromMod = state.showRules;
      rules.set(rulesFromMod);
    }
    const qrMod = state.showFeedback ? 'feedback' : state.showJoin ? 'join' : null;
    if (qrMod !== qrFromMod) {
      qrFromMod = qrMod;
      showQr(qrMod);
    }
    render();
  },
  speak: (m) => { speechQueue.push(m); pump(); },
});
</script>
</body>
</html>
